
name: Build DUAAPS Scanner APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extract project ZIP
        run: |
          unzip -o duaaps-scanner-android-capacitor-project.zip -d .
          rm -f duaaps-scanner-android-capacitor-project.zip

      - name: Install dependencies
        run: |
          npm install
          npm install --no-save typescript@5.9.3

      - name: Generate Android project
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: duaaps-scanner-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
