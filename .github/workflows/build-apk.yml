name: Build DUAAPS Scanner APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify project files
        run: |
          for f in package.json capacitor.config.ts www/index.html android/gradlew android/gradle/wrapper/gradle-wrapper.jar android/app/src/main/AndroidManifest.xml; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing $f. Commit the full contents of duaaps-scanner-fixed.zip to the repo root."
              exit 1
            fi
          done
          grep -q "android.permission.CAMERA" android/app/src/main/AndroidManifest.xml || {
            echo "::error::CAMERA permission missing from AndroidManifest.xml"
            exit 1
          }

      - name: Install dependencies
        run: |
          npm install
          npm install --no-save typescript@5.9.3

      - name: Sync web assets and plugins into the existing android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: duaaps-scanner-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
